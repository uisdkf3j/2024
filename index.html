    <style>
        /* Style for the button */
        #myButton {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 100; /* Ensure the button is above the canvas */
            padding: 12px 12px;
            background-color: #FACC15;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

         /* Style for the overlay div */
         #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white; /* semi-transparent black */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99; /* Just below the button */
        }

        /* Style for the progress bar container */
        #progressContainer {
            width: 80%;
            height: 30px;
            background: #ccc;
            border-radius: 5px;
            overflow: hidden;
        }

        /* Style for the progress bar */
        #progressBar {
            height: 100%;
            width: 0;
            background: #FACC15;
            transition: width 0.5s ease;

                function CameraMode() {
                    //Topdown view Mode


                    if (previousMode == 'isometric') {

                       // console.log('Top-down view mode');
                        previousMode = 'ortho';

                function handleMeshPicking(pickResult) {

                        } else if (name === 'room_2') {

                        }

                        BABYLON.Animation.CreateAndStartAnimation('camTarget', camera, 'target', 60, 10, camera.target, center, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);

                function crossSection () {

                        if (alphaQ >= 0 && alphaQ < Math.PI / 2) {
                            quadrant = 1;
                            
                        } else if (alphaQ >= Math.PI / 2 && alphaQ < Math.PI) {
                            quadrant = 2;
                            
                        } else if (alphaQ >= Math.PI && alphaQ < 3 * Math.PI / 2) {
                            quadrant = 3;
                            
                        } else {
                            quadrant = 4;
                            
                        }
                    //console.log('selection',selection);
                  //  console.log('quadrant',quadrant);
